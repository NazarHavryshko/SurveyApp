services:
  # 1. Реляційна база даних PostgreSQL 18
  postgres_db:
    image: postgres:18
    container_name: mysurvey_postgres
    restart: always
    environment:
      POSTGRES_DB: surveydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - survey-network

  # 2. Документоорієнтована база даних MongoDB 8.0
  mongodb:
    image: mongo:8.0
    container_name: mysurvey_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: mongosecretpassword
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - survey-network

  # 3. Мікросервіс SqlService (без container_name і ports для підтримки --scale)
  sql_service:
    build:
      context: ./src
      dockerfile: MySurveyApp.SqlService/Dockerfile
    restart: always
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Postgres=Host=postgres_db;Port=5432;Database=surveydb;Username=postgres;Password=mysecretpassword
      - InternalApiKey=YOUR_SUPER_SECRET_MICROSERVICE_KEY_12345
    depends_on:
      - postgres_db
    networks:
      - survey-network

  # 4. Мікросервіс NoSqlService (без container_name і ports для підтримки --scale)
  nosql-service:
    build:
      context: ./src
      dockerfile: MySurveyApp.NoSqlService/Dockerfile
    restart: always
    expose:
      - "5002"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5002
      - MongoDbSettings__ConnectionString=mongodb://mongoadmin:mongosecretpassword@mongodb:27017/?authSource=admin
      - MongoDbSettings__DatabaseName=MySurveyAppAnalyticsDb
      - MongoDbSettings__ResponsesCollectionName=survey_responses
      - SqlServiceSettings__BaseUrl=http://sql_service:8080
      - InternalApiKey=YOUR_SUPER_SECRET_MICROSERVICE_KEY_12345
    depends_on:
      - mongodb
      - sql_service
    networks:
      - survey-network

  # 5. API Gateway / Load Balancer (єдина зовнішня точка входу на порту 5000)
  api-gateway:
    build:
      context: ./src
      dockerfile: MySurveyApp.ApiGateway/Dockerfile
    container_name: mysurveyapp-gateway
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - sql_service
      - nosql-service
    networks:
      - survey-network

networks:
  survey-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data: